
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Task Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 20px;
    }
    h1 { color: #38bdf8; text-align: center; }
    .form { display: flex; gap: 10px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: none;
      border-radius: 8px;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    li {
      background: #1e293b;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span {
      text-decoration: line-through;
      opacity: .5;
    }
    li button { background: #dc2626; }
    #counter { color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <h1>My Task Manager</h1>
  <p id="counter"></p>

  <form class="form" id="taskForm">
    <input id="taskInput" placeholder="Введите задачу" required>
    <button type="submit">Добавить</button>
  </form>

  <ul id="taskList" style="padding:0;list-style:none"></ul>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function render() {
      const list = document.getElementById("taskList");
      list.replaceChildren();

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.onchange = () => {
          tasks[index].done = checkbox.checked;
          save();
          render();
        };

        const text = document.createElement("span");
        text.textContent = task.name;

        const del = document.createElement("button");
        del.textContent = "Удалить";
        del.onclick = () => {
          tasks.splice(index, 1);
          save();
          render();
        };

        li.append(checkbox, text, del);
        list.appendChild(li);
      });

      const completed = tasks.filter(t => t.done).length;
      document.getElementById("counter").textContent =
        `Выполнено: ${completed} из ${tasks.length}`;
    }

    document.getElementById("taskForm").onsubmit = e => {
      e.preventDefault();
      const input = document.getElementById("taskInput");
      const name = input.value.trim();
      if (!name) return;
      tasks.push({ name, done: false });
      input.value = "";
      save();
      render();
    };

    render();
  </script>
</body>
</html>
